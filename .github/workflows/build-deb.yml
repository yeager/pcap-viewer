name: Build .deb
on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build-deb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build .deb
        run: |
          set -e
          PKG="packetlens"
          PYNAME="pcap_viewer"
          VER=$(python3 -c "
          with open('pcap_viewer/__init__.py') as f:
              for line in f:
                  if '__version__' in line:
                      print(line.split('\"')[1])
                      break
          ")
          echo "Building ${PKG} ${VER}"

          sudo apt-get install -y gettext

          ROOT="pkg-deb/${PKG}"
          mkdir -p ${ROOT}/usr/lib/python3/dist-packages/${PYNAME}
          mkdir -p ${ROOT}/usr/bin
          mkdir -p ${ROOT}/usr/share/locale
          mkdir -p ${ROOT}/usr/share/applications
          mkdir -p ${ROOT}/usr/share/icons/hicolor/scalable/apps
          mkdir -p ${ROOT}/DEBIAN

          # Python package
          cp -r ${PYNAME}/* ${ROOT}/usr/lib/python3/dist-packages/${PYNAME}/

          # Launcher
          printf '#!/usr/bin/python3\nimport sys\nfrom pcap_viewer.main import main\nsys.exit(main())\n' > ${ROOT}/usr/bin/${PKG}
          chmod 755 ${ROOT}/usr/bin/${PKG}

          # Desktop + icons
          for f in data/*.desktop *.desktop; do
            [ -f "$f" ] && cp "$f" ${ROOT}/usr/share/applications/ && break
          done
          for f in data/icons/*.svg data/*.svg; do
            [ -f "$f" ] && cp "$f" ${ROOT}/usr/share/icons/hicolor/scalable/apps/ && break
          done

          # Translations
          for po in po/*.po; do
            [ -f "$po" ] || continue
            lang=$(basename "$po" .po)
            [ "$lang" = "README" ] && continue
            mkdir -p ${ROOT}/usr/share/locale/${lang}/LC_MESSAGES
            msgfmt -o ${ROOT}/usr/share/locale/${lang}/LC_MESSAGES/${PKG}.mo "$po"
          done

          # DEBIAN/control
          printf 'Package: %s\nVersion: %s-1\nArchitecture: all\nMaintainer: Daniel Nylander <daniel@danielnylander.se>\nDepends: python3 (>= 3.10), python3-gi, gir1.2-gtk-4.0, gir1.2-adw-1, python3-scapy\nSection: utils\nPriority: optional\nHomepage: https://github.com/yeager/pcap-viewer\nDescription: Network packet capture viewer\n' "${PKG}" "${VER}" > ${ROOT}/DEBIAN/control

          dpkg-deb --build --root-owner-group ${ROOT}
          mv pkg-deb/*.deb .

      - name: Upload .deb to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VER=$(python3 -c "
          with open('pcap_viewer/__init__.py') as f:
              for line in f:
                  if '__version__' in line:
                      print(line.split('\"')[1])
                      break
          ")
          DEB="packetlens_${VER}-1_all.deb"
          gh release upload "v${VER}" "$DEB" --clobber 2>/dev/null || \
          gh release upload "${{ github.ref_name }}" "$DEB" --clobber 2>/dev/null || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: deb-package
          path: "*.deb"
