name: Build RPM

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-rpm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install RPM tools
        run: sudo apt-get update && sudo apt-get install -y rpm

      - name: Get version
        id: version
        run: echo "version=$(grep -oP '__version__ = "\K[^"]+' src/pcap_viewer/__init__.py)" >> $GITHUB_OUTPUT

      - name: Setup RPM build
        run: |
          mkdir -p ~/rpmbuild/{BUILD,RPMS,SOURCES,SPECS,SRPMS}
          VERSION=${{ steps.version.outputs.version }}
          DIR=packetlens-$VERSION
          mkdir -p $DIR/src/pcap_viewer
          mkdir -p $DIR/data/icons $DIR/data/man
          cp src/pcap_viewer/*.py $DIR/src/pcap_viewer/
          cp data/se.danielnylander.packetlens.desktop $DIR/data/
          cp data/icons/se.danielnylander.packetlens.svg $DIR/data/icons/
          cp data/man/packetlens.1 $DIR/data/man/
          cp LICENSE $DIR/
          tar czf ~/rpmbuild/SOURCES/$DIR.tar.gz $DIR

      - name: Create spec file
        run: |
          cat > ~/rpmbuild/SPECS/packetlens.spec << 'SPEC'
          Name:           packetlens
          Version:        VERSION_PLACEHOLDER
          Release:        1
          Summary:        GTK4 network packet capture analyzer
          License:        GPL-3.0-or-later
          URL:            https://github.com/yeager/pcap-viewer
          Source0:        %{name}-%{version}.tar.gz
          BuildArch:      noarch
          Requires:       python3 >= 3.9
          Requires:       python3-gobject
          Requires:       gtk4
          Requires:       libadwaita
          Requires:       python3-scapy

          %description
          PacketLens is a GTK4/Libadwaita application for analyzing network packet captures.

          %prep
          %setup -q

          %install
          mkdir -p %{buildroot}%{_datadir}/packetlens/pcap_viewer
          cp src/pcap_viewer/*.py %{buildroot}%{_datadir}/packetlens/pcap_viewer/
          mkdir -p %{buildroot}%{_bindir}
          cat > %{buildroot}%{_bindir}/packetlens << 'WRAPPER'
          #!/bin/bash
          exec python3 -c "import sys; sys.path.insert(0, '/usr/share/packetlens'); from pcap_viewer.main import main; main()" "$@"
          WRAPPER
          chmod 755 %{buildroot}%{_bindir}/packetlens
          install -Dm644 data/se.danielnylander.packetlens.desktop %{buildroot}%{_datadir}/applications/se.danielnylander.packetlens.desktop
          install -Dm644 data/icons/se.danielnylander.packetlens.svg %{buildroot}%{_datadir}/icons/hicolor/scalable/apps/se.danielnylander.packetlens.svg
          install -Dm644 data/man/packetlens.1 %{buildroot}%{_mandir}/man1/packetlens.1

          %files
          %license LICENSE
          %{_bindir}/packetlens
          %{_datadir}/packetlens/
          %{_datadir}/applications/se.danielnylander.packetlens.desktop
          %{_datadir}/icons/hicolor/scalable/apps/se.danielnylander.packetlens.svg
          %{_mandir}/man1/packetlens.1*

          %changelog
          * $(date "+%a %b %d %Y") Daniel Nylander <daniel@danielnylander.se> - VERSION_PLACEHOLDER-1
          - RPM package
          SPEC
          sed -i "s/VERSION_PLACEHOLDER/${{ steps.version.outputs.version }}/g" ~/rpmbuild/SPECS/packetlens.spec

      - name: Build RPM
        run: rpmbuild -ba ~/rpmbuild/SPECS/packetlens.spec

      - name: Upload RPM to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=${{ steps.version.outputs.version }}
          TAG=${{ github.event.release.tag_name }}
          gh release upload "$TAG" \
            ~/rpmbuild/RPMS/noarch/packetlens-${VERSION}-1.noarch.rpm \
            --clobber
