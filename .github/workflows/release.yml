name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gettext rpm
      - name: Build release packages
        run: scripts/build-release.sh dist
      - name: Publish missing release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=${GITHUB_REF_NAME#v}
          files=("dist/packetlens_${version}-1_all.deb" "dist/packetlens-${version}-1.noarch.rpm")
          for file in "${files[@]}"; do test -s "$file"; done
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" "${files[@]}" --verify-tag \
              --title "PacketLens $version" --notes-file <(
                awk -v heading="## [$version]" 'index($0, heading)==1 { found=1; next } /^## / && found { exit } found { print }' CHANGELOG.md
              )
            exit
          fi
          existing=$(gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name')
          for file in "${files[@]}"; do
            if ! grep -Fxq "$(basename "$file")" <<< "$existing"; then
              gh release upload "$GITHUB_REF_NAME" "$file"
            fi
          done
