<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1c71d8"/>
      <stop offset="100%" stop-color="#0d3a7a"/>
    </linearGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#62a0ea" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#99c1f1" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#62a0ea" stop-opacity="0.3"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="128" height="128" rx="20" fill="url(#bg)"/>
  <!-- Subtle grid -->
  <g opacity="0.08" stroke="white" stroke-width="0.5">
    <line x1="0" y1="32" x2="128" y2="32"/>
    <line x1="0" y1="64" x2="128" y2="64"/>
    <line x1="0" y1="96" x2="128" y2="96"/>
    <line x1="32" y1="0" x2="32" y2="128"/>
    <line x1="64" y1="0" x2="64" y2="128"/>
    <line x1="96" y1="0" x2="96" y2="128"/>
  </g>
  <!-- Packet waveform / signal -->
  <path d="M16,68 L28,68 L32,42 L36,68 L44,68 L48,50 L52,80 L56,55 L60,68 L68,68 L72,38 L76,85 L80,45 L84,68 L92,68 L96,52 L100,75 L104,58 L108,68 L112,68" 
        stroke="#99c1f1" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  <!-- Magnifying glass -->
  <circle cx="78" cy="56" r="22" fill="none" stroke="white" stroke-width="4" opacity="0.9"/>
  <line x1="94" y1="72" x2="108" y2="86" stroke="white" stroke-width="5" stroke-linecap="round" opacity="0.9"/>
  <!-- Inner magnifier detail - packet bytes -->
  <g opacity="0.85">
    <text x="66" y="52" font-family="monospace" font-size="8" fill="#57e389" font-weight="bold">0x</text>
    <text x="66" y="62" font-family="monospace" font-size="7" fill="#99c1f1">AF</text>
    <text x="78" y="62" font-family="monospace" font-size="7" fill="#99c1f1">3C</text>
  </g>
  <!-- Network nodes -->
  <circle cx="24" cy="28" r="6" fill="#57e389" opacity="0.9"/>
  <circle cx="104" cy="28" r="6" fill="#f66151" opacity="0.9"/>
  <!-- Connection line between nodes -->
  <line x1="30" y1="28" x2="98" y2="28" stroke="white" stroke-width="1.5" opacity="0.3" stroke-dasharray="4,3"/>
  <!-- Moving packet dot -->
  <circle cx="64" cy="28" r="3" fill="#f6d32d" opacity="0.9"/>
</svg>
