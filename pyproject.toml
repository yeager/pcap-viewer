[build-system]
requires = ["setuptools>=68.0", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "pcap-viewer"
version = "0.1.2"
description = "GTK4/Adwaita application for analyzing network packet captures"
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.10"
authors = [
    {name = "Daniel Nylander", email = "daniel@danielnylander.se"},
]
keywords = ["pcap", "network", "packet", "analyzer", "gtk4"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: X11 Applications :: GTK",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Networking :: Monitoring",
]
dependencies = [
    "scapy",
    "python-magic",
]

[project.urls]
Homepage = "https://github.com/yeager/pcap-viewer"
Issues = "https://github.com/yeager/pcap-viewer/issues"

[project.gui-scripts]
pcap-viewer = "pcap_viewer.main:main"

[tool.setuptools.packages.find]
where = ["src"]
